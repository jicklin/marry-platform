<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marry-platform</title>
    <style>
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background-color: #f5f7fa; }
      #app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #2d8cf0; }
      #app-loading .logo { font-size: 48px; font-weight: 700; letter-spacing: -1px; margin-bottom: 16px; background: linear-gradient(135deg, #2d8cf0, #5fa3ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      #app-loading .tagline { color: #606266; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="logo">🍵 marry-platform</div>
        <div class="tagline">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
