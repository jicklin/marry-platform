server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: marry-platform
  profiles:
    active: @app.profiles.active@
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
        allow:
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*'
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      database: 0
      password:

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.marry.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.marry: DEBUG
    org.springframework.security: INFO
    com.baomidou.mybatisplus: WARN
  pattern:
    console: '%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr(${PID:- }){magenta} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n'
  file:
    name: logs/${spring.application.name}.log

marry:
  jwt:
    secret: ${JWT_SECRET:replace-me-in-production-with-32-or-more-characters-please}
    access-ttl: 1800000          # 30 min
    refresh-ttl: 604800000       # 7 days
    header: Authorization
    token-prefix: 'Bearer '
    redis-key-prefix: 'marry:token:'
    online-key: 'marry:online'
  security:
    permit-all:
      - /auth/login
      - /auth/refresh
      - /auth/captcha
      - /error
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /favicon.ico
      - /druid/**
      - /actuator/**
      - /static/**

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    swagger-model-name: 实体类列表
  basic:
    enable: true
    username: admin
    password: admin