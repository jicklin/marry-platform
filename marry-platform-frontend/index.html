<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#fb7185" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Marry Platform</title>
    <style>
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background-color: #f5f7fa; }
      #app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #2d8cf0; }
      #app-loading .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 32px; font-weight: 700; letter-spacing: -1px; }
      #app-loading .logo img { width: 52px; height: 52px; filter: drop-shadow(0 8px 14px rgba(251, 113, 133, .25)); }
      #app-loading .logo span { background: linear-gradient(135deg, #fb7185, #e84a78); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      #app-loading .tagline { color: #606266; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="logo"><img src="/favicon.svg" alt="" /><span>marry-platform</span></div>
        <div class="tagline">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
