# ============================================================
# marry-platform — Nginx reverse-proxy & SPA config
#
# Place at: /usr/local/etc/nginx/servers/marry-platform.conf
# (or /etc/nginx/conf.d/marry-platform.conf on Linux)
# Reload:  nginx -t && nginx -s reload
#
# Layout:
#   /              → frontend dist/  (Vue 3 SPA, hash router)
#   /api/          → Spring Boot 8080 (admin module)
#   /api/doc.html  → Knife4j (public)
#   /api/druid/    → Druid monitor (basic-auth in dev)
# ============================================================

upstream marry_backend {
    # Single instance; add more peers + ip_hash for horizontal scaling
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;                                   # change to your domain

    # 100MB upload body — adjust to taste
    client_max_body_size 100m;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy   "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: https:; connect-src 'self' http: https: ws: wss:;" always;

    # Gzip
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ----- Frontend static files -----
    root /var/www/marry-platform/dist;
    index index.html;

    # Long cache for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — hash router so any path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- Backend API reverse proxy -----
    location /api/ {
        proxy_pass         http://marry_backend/;       # strip /api prefix
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # WebSocket (for Knife4j / hot-reload if used)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering for streaming endpoints
        proxy_buffering      off;
        proxy_request_buffering off;
    }

    # ----- Optional: HTTPS termination -----
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/marry.crt;
    # ssl_certificate_key /etc/nginx/ssl/marry.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    # ----- Logging -----
    access_log /var/log/nginx/marry-platform.access.log;
    error_log  /var/log/nginx/marry-platform.error.log warn;
}