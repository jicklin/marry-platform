# ============================================================
# marry-platform — Nginx config for the Docker stack
# (Overlays deploy/nginx/marry-platform.conf — only difference is the
#  upstream `server` directive, which must point at the backend
#  container hostname instead of 127.0.0.1.)
# ============================================================

upstream marry_backend {
    server backend:10045;
    keepalive 32;
}

server {
    listen       5173;
    server_name  _;

    client_max_body_size 100m;

    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy   "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:;" always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    root /var/www/marry-platform/dist;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass         http://marry_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering      off;
        proxy_request_buffering off;
    }

    access_log /var/log/nginx/marry-platform.access.log;
    error_log  /var/log/nginx/marry-platform.error.log warn;
}