server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: marry-platform
  profiles:
    active: @app.profiles.active@
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    # Jackson leniency (fail-on-unknown-properties off, etc.) is configured
    # programmatically via com.marry.common.json.JacksonConfig so it
    # survives custom ObjectMapper overrides.
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: marry-pool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      database: 0
      password:

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.marry.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        # env / loggers 隐藏 — 否则 `marry.jwt.secret` / 整个 application.yml 都会被匿名访问
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.marry: DEBUG
    org.springframework.security: INFO
    com.baomidou.mybatisplus: WARN
  pattern:
    # %X{requestId} comes from com.marry.common.web.RequestIdFilter (MDC).
    console: '%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr(${PID:- }){magenta} %clr([%X{requestId:--}]){faint} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n'
  file:
    name: logs/${spring.application.name}.log

marry:
  jwt:
    secret: ${JWT_SECRET:ccucZJFr8DXdfzh0nSvUEf1NP2jdyUCR}
    access-ttl: 1800000          # 30 min
    refresh-ttl: 604800000       # 7 days
    header: Authorization
    token-prefix: 'Bearer '
    redis-key-prefix: 'marry:token:'
    online-key: 'marry:online'
  security:
    permit-all:
      - /auth/login
      - /auth/refresh
      - /auth/captcha
      - /error
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /favicon.ico
      - /actuator/health
      - /actuator/info
      - /static/**

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    swagger-model-name: 实体类列表
  basic:
    enable: true
    username: admin
    password: admin
